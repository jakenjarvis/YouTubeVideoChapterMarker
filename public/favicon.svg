<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="YouTube Video Chapter Marker">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0D0F12" stroke="#262B34" stroke-width="3" />
  <!-- Horizontal timeline track -->
  <rect x="11" y="38" width="42" height="5" rx="2.5" fill="#1E2430" />
  <rect x="11" y="38" width="24" height="5" rx="2.5" fill="#F59E0B" fill-opacity="0.35" />
  <!-- Playhead marker pin (Amber) -->
  <polygon points="35,14 43,22 35,30 27,22" fill="#F59E0B" />
  <rect x="33.5" y="26" width="3" height="24" rx="1.5" fill="#F59E0B" />
  <!-- Secondary scene reference ticks (Sky) -->
  <rect x="18" y="45" width="3" height="6" rx="1.5" fill="#38BDF8" />
  <rect x="46" y="45" width="3" height="6" rx="1.5" fill="#38BDF8" />
</svg>
